[versions]
project-java = "25"
project-minecraft = "26.3"
project-minecraft-range = "[26.3]"
project-neoform = "26.3-1"
project-fabric-api = "0.160.7+26.3"
project-fabric-loader = "0.19.5"
project-neoforge = "26.3.0.4-beta"
project-neoforge-loader-range = "[4,)"
fabric-loom = "1.15.5"
neoforged-moddev = "2.0.147"
buildconfig = "6.0.9"
foojay-resolver-convention = "1.0.0"
# Kotlin 运行时（stdlib / kotlinx）通过 jar-in-jar 随 Fabric 与 NeoForge 产物一起分发，
# 因此这里的 kotlin 版本同时决定 Kotlin 编译器、kotlin-stdlib 与 kotlinx 库的可用语言特性。
kotlin = "2.4.21"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.12.0"
mixin = "0.8.5"
mixinextras = "0.5.4"
asm = "9.8"
sodium-fabric = "mc26.3-0.9.2-fabric"
sodium-neoforge = "mc26.3-0.9.2-neoforge"
iris-fabric = "1.11.6+26.3-fabric"
# Iris 尚未发布 26.3 的 NeoForge 构建，NeoForge 侧暂时复用 Fabric 产物编译 IrisApi/IrisProgram；
# 两者 API 包名一致，且该依赖仅参与 compileOnly。Iris 发布 26.3 NeoForge 后应换回 -neoforge 版本。
iris-neoforge = "1.11.6+26.3-fabric"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "project-minecraft" }
# buildSrc 预编译脚本插件在 apply Kotlin 插件时需要 KGP 位于其类路径，版本与 kotlin 保持一致。
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "project-fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "project-fabric-api" }
mixin = { module = "org.spongepowered:mixin", version.ref = "mixin" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
sodium-fabric = { module = "maven.modrinth:sodium", version.ref = "sodium-fabric" }
sodium-neoforge = { module = "maven.modrinth:sodium", version.ref = "sodium-neoforge" }
iris-fabric = { module = "maven.modrinth:iris", version.ref = "iris-fabric" }
iris-neoforge = { module = "maven.modrinth:iris", version.ref = "iris-neoforge" }

[plugins]
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
neoforged-moddev = { id = "net.neoforged.moddev", version.ref = "neoforged-moddev" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "buildconfig" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
